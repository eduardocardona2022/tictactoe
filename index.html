<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="particles-container"></div>

  <div id="start-screen">
    <div class="start-content">
      <h1 class="title">Tic Tac Toe</h1>
      <p class="subtitle">Dos jugadores. Un tablero. Gloria eterna.</p>
      <button id="start-btn" class="btn-neon">Iniciar Partida</button>
    </div>
  </div>

  <div id="game-container" class="hidden">
    <button id="sound-toggle" class="sound-toggle" title="Sonido">🔊</button>
    <div id="turn-indicator" class="turn-x">Turno de <span class="player-name">X</span></div>

    <div id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div id="scoreboard">
      <div class="score-item score-x">
        <span class="score-label">X</span>
        <span id="score-x" class="score-value">0</span>
      </div>
      <div class="score-item score-draw">
        <span class="score-label">Empates</span>
        <span id="score-draws" class="score-value">0</span>
      </div>
      <div class="score-item score-o">
        <span class="score-label">O</span>
        <span id="score-o" class="score-value">0</span>
      </div>
    </div>

    <button id="restart-btn" class="btn-neon btn-sm">Reiniciar</button>
  </div>

  <div id="result-overlay" class="hidden">
    <div class="result-content">
      <h2 id="result-message"></h2>
      <button id="play-again-btn" class="btn-neon">Jugar de nuevo</button>
    </div>
  </div>

  <script src="game-core.cjs"></script>
  <script src="game.js"></script>
</body>
</html>
